<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OBS Overlay</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@600;700;800&display=swap');

    * { margin: 0; padding: 0; box-sizing: border-box; }

    /* CRITICAL: Transparent background for OBS chroma-key */
    html, body {
      background: transparent !important;
      overflow: hidden;
      width: 1920px;
      height: 1080px;
    }

    :root {
      --red:        #ff2200;
      --red-glow:   rgba(255,34,0,0.4);
      --amber:      #ffb700;
      --amber-glow: rgba(255,183,0,0.35);
      --green:      #00e676;
      --text:       #ffffff;
      --font-display: 'Bebas Neue', sans-serif;
      --font-body:    'Barlow Condensed', sans-serif;
    }

    /* ── Progress bar (bottom strip) ─────────────────────────── */
    .overlay-progress {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 60px;
      display: flex;
      flex-direction: column;
    }

    .progress-info-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      padding: 0 20px 4px;
    }

    .progress-label {
      font-family: var(--font-display);
      font-size: 20px;
      letter-spacing: 3px;
      color: rgba(255,255,255,0.85);
      text-shadow: 0 2px 8px rgba(0,0,0,0.8);
    }

    .progress-numbers {
      font-family: var(--font-display);
      font-size: 24px;
      letter-spacing: 2px;
      color: var(--amber);
      text-shadow: 0 0 20px var(--amber-glow), 0 2px 8px rgba(0,0,0,0.8);
    }

    .progress-bar-outer {
      height: 16px;
      background: rgba(0,0,0,0.5);
      border-top: 1px solid rgba(255,255,255,0.1);
      position: relative;
      overflow: hidden;
    }

    .progress-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, #991500, #ff2200, #ffb700);
      transition: width 1.5s cubic-bezier(0.25, 0.46, 0.45, 0.94);
      box-shadow: 0 0 15px rgba(255,34,0,0.6);
      position: relative;
    }

    .progress-bar-fill::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, transparent 60%, rgba(255,255,255,0.2) 80%, transparent);
      animation: shine 2s ease-in-out infinite;
    }

    @keyframes shine {
      0%   { transform: translateX(-100%); }
      100% { transform: translateX(200%); }
    }

    /* ── Subscriber count badge (top-right) ──────────────────── */
    .sub-badge {
      position: absolute;
      top: 20px;
      right: 20px;
      background: rgba(0,0,0,0.75);
      border: 1px solid rgba(255,34,0,0.5);
      box-shadow: 0 0 20px rgba(255,34,0,0.2);
      padding: 10px 20px;
      backdrop-filter: blur(4px);
      clip-path: polygon(8px 0%, 100% 0%, calc(100% - 8px) 100%, 0% 100%);
    }

    .sub-badge-count {
      font-family: var(--font-display);
      font-size: 52px;
      line-height: 1;
      color: #fff;
      letter-spacing: 1px;
    }

    .sub-badge-label {
      font-family: var(--font-display);
      font-size: 13px;
      letter-spacing: 3px;
      color: rgba(255,255,255,0.5);
      text-align: right;
    }

    /* ── Alert popup ─────────────────────────────────────────── */
    .alert-container {
      position: absolute;
      bottom: 80px;
      left: 50%;
      transform: translateX(-50%);
      width: 700px;
      pointer-events: none;
    }

    .alert-popup {
      background: linear-gradient(135deg, rgba(8,10,15,0.96), rgba(15,25,35,0.96));
      border: 2px solid var(--red);
      box-shadow:
        0 0 60px rgba(255,34,0,0.4),
        0 0 120px rgba(255,34,0,0.15),
        inset 0 0 40px rgba(255,34,0,0.05);
      padding: 28px 50px;
      text-align: center;
      position: relative;
      opacity: 0;
      transform: scale(0.5) translateY(30px);
      backdrop-filter: blur(10px);
    }

    .alert-popup::before,
    .alert-popup::after {
      content: '';
      position: absolute;
      width: 16px; height: 16px;
    }
    .alert-popup::before {
      top: 6px; left: 6px;
      border-top: 2px solid var(--amber);
      border-left: 2px solid var(--amber);
    }
    .alert-popup::after {
      bottom: 6px; right: 6px;
      border-bottom: 2px solid var(--amber);
      border-right: 2px solid var(--amber);
    }

    .alert-popup.show {
      animation: alert-pop-in 0.55s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    }

    .alert-popup.hide {
      animation: alert-pop-out 0.35s ease-in forwards;
    }

    @keyframes alert-pop-in {
      0%   { opacity: 0; transform: scale(0.4) translateY(40px); }
      60%  { opacity: 1; transform: scale(1.04) translateY(0); }
      100% { opacity: 1; transform: scale(1) translateY(0); }
    }

    @keyframes alert-pop-out {
      0%   { opacity: 1; transform: scale(1); }
      100% { opacity: 0; transform: scale(0.7) translateY(-20px); }
    }

    .alert-scanline {
      position: absolute;
      left: 0; right: 0;
      height: 1px;
      background: rgba(255,34,0,0.5);
      animation: scan 2s linear infinite;
    }

    @keyframes scan {
      0%   { top: 0; }
      100% { top: 100%; }
    }

    .alert-fire {
      font-size: 40px;
      display: block;
      margin-bottom: 10px;
      animation: fire-shake 0.4s ease-in-out infinite alternate;
    }

    @keyframes fire-shake {
      from { transform: scale(1) rotate(-4deg); }
      to   { transform: scale(1.1) rotate(4deg); }
    }

    .alert-thanks {
      font-family: var(--font-display);
      font-size: 18px;
      letter-spacing: 5px;
      color: rgba(255,255,255,0.6);
      margin-bottom: 6px;
    }

    .alert-username {
      font-family: var(--font-display);
      font-size: 52px;
      line-height: 1;
      color: var(--amber);
      text-shadow: 0 0 30px var(--amber-glow), 0 0 60px rgba(255,183,0,0.2);
      word-break: break-all;
      letter-spacing: 2px;
      margin-bottom: 8px;
      animation: glow-pulse 1s ease-in-out infinite alternate;
    }

    @keyframes glow-pulse {
      from { text-shadow: 0 0 20px var(--amber-glow); }
      to   { text-shadow: 0 0 50px rgba(255,183,0,0.7), 0 0 80px rgba(255,183,0,0.3); }
    }

    .alert-sub {
      font-family: var(--font-display);
      font-size: 16px;
      letter-spacing: 4px;
      color: rgba(255,255,255,0.5);
    }

    /* ── Milestone banner ──────────────────────────────────────── */
    .milestone-banner {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: linear-gradient(135deg, rgba(10,10,20,0.97), rgba(20,15,40,0.97));
      border: 2px solid var(--amber);
      box-shadow: 0 0 80px var(--amber-glow), inset 0 0 40px rgba(255,183,0,0.05);
      padding: 30px 60px;
      text-align: center;
      clip-path: polygon(16px 0%, 100% 0%, calc(100% - 16px) 100%, 0% 100%);
      opacity: 0;
      pointer-events: none;
    }

    .milestone-banner.show {
      animation: milestone-in 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    }

    .milestone-banner.hide {
      animation: milestone-out 0.4s ease-in forwards;
    }

    @keyframes milestone-in {
      0%   { opacity: 0; transform: translate(-50%, -50%) scale(0.5); }
      60%  { opacity: 1; transform: translate(-50%, -50%) scale(1.04); }
      100% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
    }

    @keyframes milestone-out {
      to { opacity: 0; transform: translate(-50%, -50%) scale(0.8); }
    }

    .milestone-pct {
      font-family: var(--font-display);
      font-size: 100px;
      line-height: 1;
      color: var(--amber);
      text-shadow: 0 0 40px var(--amber-glow);
    }

    .milestone-label {
      font-family: var(--font-display);
      font-size: 22px;
      letter-spacing: 6px;
      color: rgba(255,255,255,0.7);
    }

    /* ── Confetti canvas ─────────────────────────────────────── */
    #confetti-canvas {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }
  </style>
</head>
<body>

<canvas id="confetti-canvas"></canvas>

<!-- Progress bar (bottom) -->
<div class="overlay-progress">
  <div class="progress-info-row">
    <div class="progress-label">SUBSCRIBER GOAL</div>
    <div class="progress-numbers">
      <span id="overlayCount">0</span> / <span id="overlayGoal">10,000</span>
    </div>
  </div>
  <div class="progress-bar-outer">
    <div class="progress-bar-fill" id="overlayFill" style="width:0%"></div>
  </div>
</div>

<!-- Sub count badge (top right) -->
<div class="sub-badge">
  <div class="sub-badge-count" id="overlayBadgeCount">0</div>
  <div class="sub-badge-label">SUBSCRIBERS</div>
</div>

<!-- Alert popup (bottom center) -->
<div class="alert-container">
  <div class="alert-popup" id="overlayAlert">
    <div class="alert-scanline"></div>
    <span class="alert-fire">🔥</span>
    <div class="alert-thanks">THANK YOU</div>
    <div class="alert-username" id="overlayAlertUser">USERNAME</div>
    <div class="alert-sub">FOR SUBSCRIBING 🔥</div>
  </div>
</div>

<!-- Milestone banner (center) -->
<div class="milestone-banner" id="milestoneBanner">
  <div class="milestone-pct" id="milestonePct">50%</div>
  <div class="milestone-label">MILESTONE REACHED!</div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
  // ═══════════════════════════════════════════════════════════════════════════
  //  🔊  OBS OVERLAY SOUND ENGINE  (Web Audio API — no external files)
  // ═══════════════════════════════════════════════════════════════════════════
  var _ac = null;
  function getAC() {
    if (!_ac) _ac = new (window.AudioContext || window.webkitAudioContext)();
    if (_ac.state === 'suspended') _ac.resume();
    return _ac;
  }
  // OBS browser source: unlock AudioContext on first click/load
  document.addEventListener('click', function() { getAC(); }, { once: true });
  // Also try to unlock immediately after a short delay (OBS auto-interaction)
  setTimeout(function() { try { getAC(); } catch(e) {} }, 500);

  function overlayPlayNotes(notes, masterVol) {
    var ac = getAC();
    var mg = ac.createGain();
    mg.gain.value = masterVol || 0.75;
    mg.connect(ac.destination);
    notes.forEach(function(n) {
      var osc = ac.createOscillator(), g = ac.createGain();
      osc.type = n.type || 'sine';
      osc.frequency.setValueAtTime(n.freq, ac.currentTime + n.t);
      g.gain.setValueAtTime(0, ac.currentTime + n.t);
      g.gain.linearRampToValueAtTime(n.vol || 0.3, ac.currentTime + n.t + 0.01);
      g.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + n.t + n.dur + (n.rel || 0.1));
      osc.connect(g); g.connect(mg);
      osc.start(ac.currentTime + n.t);
      osc.stop(ac.currentTime + n.t + n.dur + (n.rel || 0.1) + 0.05);
    });
  }

  // 🔔 Bell arpeggio — C5 E5 G5 C6
  function overlayDing() {
    var ac = getAC();
    var freqs = [523.25, 659.25, 783.99, 1046.5];
    freqs.forEach(function(f, i) {
      var osc = ac.createOscillator(), g = ac.createGain();
      osc.type = 'sine';
      osc.frequency.value = f;
      var t = ac.currentTime + i * 0.08;
      g.gain.setValueAtTime(0, t);
      g.gain.linearRampToValueAtTime(0.22, t + 0.008);
      g.gain.exponentialRampToValueAtTime(0.001, t + 1.8);
      osc.connect(g); g.connect(ac.destination);
      osc.start(t); osc.stop(t + 2.0);
    });
  }

  // 🏆 Milestone fanfare — C4 E4 G4 C5 brass motif
  function overlayFanfare() {
    overlayPlayNotes([
      { freq: 261.63, t: 0.00, dur: 0.18, type: 'sawtooth', vol: 0.28, rel: 0.08 },
      { freq: 329.63, t: 0.15, dur: 0.18, type: 'sawtooth', vol: 0.28, rel: 0.08 },
      { freq: 392.00, t: 0.30, dur: 0.18, type: 'sawtooth', vol: 0.28, rel: 0.08 },
      { freq: 523.25, t: 0.45, dur: 0.50, type: 'sawtooth', vol: 0.32, rel: 0.20 },
      { freq: 392.00, t: 0.45, dur: 0.50, type: 'sawtooth', vol: 0.18, rel: 0.20 },
      { freq: 65.41,  t: 0.45, dur: 0.35, type: 'square',   vol: 0.22, rel: 0.15 },
    ], 0.8);
    var ac = getAC(), o = ac.createOscillator(), g = ac.createGain();
    var t = ac.currentTime + 0.45;
    o.type = 'sine'; o.frequency.setValueAtTime(140, t);
    o.frequency.exponentialRampToValueAtTime(0.001, t + 0.3);
    g.gain.setValueAtTime(0.65, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.3);
    o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t + 0.35);
  }

  // ─── Confetti ──────────────────────────────────────────────────────────────
  const canvas = document.getElementById('confetti-canvas');
  const ctx = canvas.getContext('2d');
  canvas.width = 1920; canvas.height = 1080;
  const COLORS = ['#ff2200','#ffb700','#00e676','#00d4ff','#ffffff','#ff6644'];
  let particles = [];

  function spawnConfetti(n) {
    n = n || 200;
    for (let i = 0; i < n; i++) {
      particles.push({
        x: Math.random() * canvas.width, y: -20,
        w: Math.random() * 12 + 4, h: Math.random() * 6 + 3,
        color: COLORS[Math.floor(Math.random() * COLORS.length)],
        angle: Math.random() * Math.PI * 2,
        spin: (Math.random() - 0.5) * 0.2,
        vx: (Math.random() - 0.5) * 6, vy: Math.random() * 5 + 3,
        gravity: 0.12, alpha: 1, decay: Math.random() * 0.008 + 0.002,
      });
    }
  }

  function animateConfetti() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    particles = particles.filter(p => p.alpha > 0);
    for (const p of particles) {
      p.x += p.vx; p.y += p.vy; p.vy += p.gravity; p.angle += p.spin; p.alpha -= p.decay;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.angle);
      ctx.globalAlpha = Math.max(0, p.alpha); ctx.fillStyle = p.color;
      ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); ctx.restore();
    }
    requestAnimationFrame(animateConfetti);
  }
  animateConfetti();

  // ─── Socket ────────────────────────────────────────────────────────────────
  const socket = io();

  socket.on('subscriberUpdate', ({ count, goal }) => {
    const pct = Math.min(100, Math.round((count / goal) * 100));
    document.getElementById('overlayCount').textContent = count.toLocaleString();
    document.getElementById('overlayGoal').textContent = goal.toLocaleString();
    document.getElementById('overlayFill').style.width = pct + '%';
    document.getElementById('overlayBadgeCount').textContent = count.toLocaleString();
  });

  socket.on('subscriberDetected', ({ username }) => {
    showAlert(username);
    spawnConfetti(150);
    overlayDing();        // 🔔 Bell ding fires in OBS
  });

  socket.on('milestoneReached', ({ percent }) => {
    showMilestone(percent);
    spawnConfetti(300);
    overlayFanfare();     // 🏆 Fanfare fires in OBS
  });

  // ─── Alert Popup ──────────────────────────────────────────────────────────
  let alertTimer = null;
  function showAlert(username) {
    const popup = document.getElementById('overlayAlert');
    document.getElementById('overlayAlertUser').textContent = username;
    popup.classList.remove('show', 'hide');
    void popup.offsetWidth;
    popup.classList.add('show');
    if (alertTimer) clearTimeout(alertTimer);
    alertTimer = setTimeout(() => {
      popup.classList.remove('show');
      popup.classList.add('hide');
    }, 5000);
  }

  function showMilestone(percent) {
    const banner = document.getElementById('milestoneBanner');
    document.getElementById('milestonePct').textContent = percent + '%';
    banner.classList.remove('show', 'hide');
    void banner.offsetWidth;
    banner.classList.add('show');
    spawnConfetti(400);
    setTimeout(() => {
      banner.classList.remove('show');
      banner.classList.add('hide');
    }, 6000);
  }
</script>
</body>
</html>
